name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` and any module that reads these
      # at import time have something to parse. No real database is used —
      # tests mock src/db/prisma and never open a connection.
      DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"
      DIRECT_URL: "postgresql://user:password@localhost:5432/dummy"
      API_KEY: "ci-test-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
